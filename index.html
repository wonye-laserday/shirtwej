<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Camera</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    html, body { width: 100%; height: 100dvh; overflow: hidden; background: #000; }

    #stage {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    video, canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    #threeCanvas { z-index: 2; pointer-events: none; }
    #workCanvas { display: none; }
    video.mirror, canvas.mirror { transform: scaleX(-1); }

    .top-bar {
      position: absolute;
      top: 18px;
      right: 18px;
      z-index: 10;
    }

    .cam-switch {
      background: rgba(0, 0, 0, 0.35);
      backdrop-filter: blur(6px);
      border: 1px solid rgba(255, 255, 255, 0.25);
      color: #fff;
      padding: 8px 14px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }

    .bottom-bar {
      position: absolute;
      bottom: 28px;
      left: 0;
      right: 0;
      z-index: 10;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 28px;
    }

    #photoBtn {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      border: 4px solid #fff;
      background: rgba(255, 255, 255, 0.22);
      cursor: pointer;
    }
    #photoBtn:active { transform: scale(0.92); background: #fff; }

    #videoBtn {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, 0.7);
      background: rgba(0, 0, 0, 0.35);
      backdrop-filter: blur(6px);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    #videoBtn .dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #ef4444;
    }
    #videoBtn.recording {
      border-color: #ef4444;
      background: rgba(239, 68, 68, 0.25);
    }
    #videoBtn.recording .dot {
      width: 14px;
      height: 14px;
      border-radius: 3px;
      background: #ef4444;
    }
  </style>
</head>
<body>
  <div id="stage">
    <video id="video" autoplay playsinline muted></video>
    <canvas id="threeCanvas"></canvas>
    <canvas id="workCanvas"></canvas>

    <div class="top-bar">
      <button class="cam-switch" id="flipBtn">Gira</button>
    </div>

    <div class="bottom-bar">
      <button id="videoBtn" aria-label="Video"><span class="dot"></span></button>
      <button id="photoBtn" aria-label="Foto"></button>
      <div style="width:48px;"></div>
    </div>
  </div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/js-aruco2@1.0.1/src/cv.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/js-aruco2@1.0.1/src/aruco.js" crossorigin="anonymous"></script>

  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

    const ARUCO_GLB_MAP = {
      0: 'wings-0.glb',
      1: 'wings-1.glb',
      2: 'wings-2.glb',
      3: 'wings-3.glb',
      4: 'wings-4.glb',
      5: 'wings-5.glb',
      6: 'wings-6.glb',
      7: 'wings-7.glb',
      8: 'wings-8.glb',
      9: 'wings-9.glb'
    };

    const video = document.getElementById('video');
    const threeCanvas = document.getElementById('threeCanvas');
    const workCanvas = document.getElementById('workCanvas');
    const workCtx = workCanvas.getContext('2d', { willReadFrequently: true });

    let facingMode = 'environment';
    let currentStream = null;
    let activeMarkerId = null;
    let bodyDetected = false;
    const loadedCache = new Map();

    const renderer = new THREE.WebGLRenderer({ canvas: threeCanvas, alpha: true, antialias: true, preserveDrawingBuffer: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(50, 1, 0.01, 100);
    camera.position.set(0, 0, 2.5);

    scene.add(new THREE.HemisphereLight(0xffffff, 0x444444, 1.8));
    const dirLight = new THREE.DirectionalLight(0xffffff, 1.5);
    dirLight.position.set(1, 2, 3);
    scene.add(dirLight);

    const anchorGroup = new THREE.Group();
    anchorGroup.visible = false;
    scene.add(anchorGroup);

    const modelHolder = new THREE.Group();
    anchorGroup.add(modelHolder);

    const gltfLoader = new GLTFLoader();

    function attachModelForMarker(markerId) {
      if (!(markerId in ARUCO_GLB_MAP)) return;

      if (loadedCache.has(markerId)) {
        modelHolder.clear();
        modelHolder.add(loadedCache.get(markerId));
        return;
      }

      const filePath = ARUCO_GLB_MAP[markerId];
      gltfLoader.load(
        filePath,
        (gltf) => {
          const model = gltf.scene;
          const box = new THREE.Box3().setFromObject(model);
          const size = new THREE.Vector3();
          const center = new THREE.Vector3();
          box.getSize(size);
          box.getCenter(center);

          const maxDim = Math.max(size.x, size.y, size.z) || 1;
          const normScale = 1.4 / maxDim;

          model.position.sub(center);
          const wrapper = new THREE.Group();
          wrapper.add(model);
          wrapper.scale.setScalar(normScale);

          loadedCache.set(markerId, wrapper);
          if (activeMarkerId === markerId) {
            modelHolder.clear();
            modelHolder.add(wrapper);
          }
        },
        undefined,
        () => {
          if (activeMarkerId === markerId) {
            modelHolder.clear();
          }
        }
      );
    }

    const detector = window.AR ? new window.AR.Detector({ dictionaryName: 'ARUCO_4X4_50' }) : null;
    let lastMarkerSeenAt = 0;

    function detectArucoCode() {
      if (!detector || video.readyState < 2) return;
      workCanvas.width = 960;
      workCanvas.height = 720;
      workCtx.drawImage(video, 0, 0, workCanvas.width, workCanvas.height);
      const imgData = workCtx.getImageData(0, 0, workCanvas.width, workCanvas.height);
      const markers = detector.detect(imgData);

      if (markers && markers.length > 0) {
        const foundId = markers[0].id;
        if (foundId in ARUCO_GLB_MAP) {
          lastMarkerSeenAt = performance.now();
          if (activeMarkerId !== foundId) {
            activeMarkerId = foundId;
            attachModelForMarker(foundId);
          }
        }
      } else if (activeMarkerId !== null && performance.now() - lastMarkerSeenAt > 1800) {
        activeMarkerId = null;
        modelHolder.clear();
      }
    }

    const targetPos = new THREE.Vector3(0, 0.08, 0);
    let targetScale = 1.0;
    let targetYaw = 0;
    let targetRoll = 0;

    const pose = new window.Pose({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`
    });
    pose.setOptions({
      modelComplexity: 1,
      smoothLandmarks: true,
      minDetectionConfidence: 0.5,
      minTrackingConfidence: 0.5
    });

    pose.onResults((results) => {
      const lm = results.poseLandmarks;
      if (lm && lm[11] && lm[12] && lm[11].visibility > 0.4 && lm[12].visibility > 0.4) {
        bodyDetected = true;
        const midX = (lm[11].x + lm[12].x) * 0.5;
        const midY = (lm[11].y + lm[12].y) * 0.5 + 0.04;
        const dx = lm[11].x - lm[12].x;
        const dy = lm[11].y - lm[12].y;
        const dz = lm[11].z - lm[12].z;
        const shoulderWidth2D = Math.hypot(dx, dy);

        targetPos.set((midX - 0.5) * 2.2 * camera.aspect, -(midY - 0.5) * 2.2, 0);
        targetScale = THREE.MathUtils.clamp(shoulderWidth2D * 3.8, 0.35, 2.8);
        targetYaw = Math.atan2(dz, Math.abs(dx) + 0.001) * 0.7;
        targetRoll = -Math.atan2(dy, dx);
      } else {
        bodyDetected = false;
      }

      anchorGroup.visible = Boolean(activeMarkerId !== null && bodyDetected && modelHolder.children.length > 0);
    });

    async function startCamera() {
      if (currentStream) currentStream.getTracks().forEach(t => t.stop());
      try {
        currentStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode, width: { ideal: 1280 }, height: { ideal: 720 } },
          audio: false
        });
        video.srcObject = currentStream;
        await video.play();
        const mirror = facingMode === 'user';
        video.classList.toggle('mirror', mirror);
        threeCanvas.classList.toggle('mirror', mirror);
      } catch {}
    }

    document.getElementById('flipBtn').addEventListener('click', () => {
      facingMode = facingMode === 'environment' ? 'user' : 'environment';
      startCamera();
    });

    function resize() {
      const w = video.parentElement.clientWidth;
      const h = video.parentElement.clientHeight;
      renderer.setSize(w, h, false);
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
    }
    window.addEventListener('resize', resize);

    let lastVideoTime = -1;
    async function animate() {
      requestAnimationFrame(animate);
      resize();

      if (video.readyState >= 2 && video.currentTime !== lastVideoTime) {
        lastVideoTime = video.currentTime;
        detectArucoCode();
        await pose.send({ image: video });
      }

      if (anchorGroup.visible) {
        anchorGroup.position.lerp(targetPos, 0.25);
        const nextS = THREE.MathUtils.lerp(anchorGroup.scale.x, targetScale, 0.25);
        anchorGroup.scale.setScalar(nextS);
        anchorGroup.rotation.y = THREE.MathUtils.lerp(anchorGroup.rotation.y, targetYaw, 0.2);
        anchorGroup.rotation.z = THREE.MathUtils.lerp(anchorGroup.rotation.z, targetRoll, 0.2);
      }

      renderer.render(scene, camera);
    }

    function drawCompositeToCanvas(targetCanvas) {
      targetCanvas.width = threeCanvas.width;
      targetCanvas.height = threeCanvas.height;
      const ctx = targetCanvas.getContext('2d');

      if (facingMode === 'user') {
        ctx.translate(targetCanvas.width, 0);
        ctx.scale(-1, 1);
      }

      const vRatio = video.videoWidth / video.videoHeight;
      const cRatio = targetCanvas.width / targetCanvas.height;
      let drawW = targetCanvas.width, drawH = targetCanvas.height, offsetX = 0, offsetY = 0;
      if (vRatio > cRatio) {
        drawW = targetCanvas.height * vRatio;
        offsetX = (targetCanvas.width - drawW) / 2;
      } else {
        drawH = targetCanvas.width / vRatio;
        offsetY = (targetCanvas.height - drawH) / 2;
      }
      ctx.drawImage(video, offsetX, offsetY, drawW, drawH);
      ctx.drawImage(threeCanvas, 0, 0, targetCanvas.width, targetCanvas.height);
    }

    document.getElementById('photoBtn').addEventListener('click', () => {
      const snap = document.createElement('canvas');
      drawCompositeToCanvas(snap);
      const a = document.createElement('a');
      a.download = `foto-${Date.now()}.png`;
      a.href = snap.toDataURL('image/png');
      a.click();
    });

    let mediaRecorder = null;
    let recordedChunks = [];
    let recLoopId = null;
    const videoBtn = document.getElementById('videoBtn');

    videoBtn.addEventListener('click', () => {
      if (mediaRecorder && mediaRecorder.state === 'recording') {
        mediaRecorder.stop();
        cancelAnimationFrame(recLoopId);
        videoBtn.classList.remove('recording');
        return;
      }

      const recCanvas = document.createElement('canvas');
      drawCompositeToCanvas(recCanvas);

      function pumpFrame() {
        drawCompositeToCanvas(recCanvas);
        recLoopId = requestAnimationFrame(pumpFrame);
      }
      pumpFrame();

      const stream = recCanvas.captureStream(30);
      const mimeType = MediaRecorder.isTypeSupported('video/webm;codecs=vp9')
        ? 'video/webm;codecs=vp9'
        : 'video/webm';

      recordedChunks = [];
      mediaRecorder = new MediaRecorder(stream, { mimeType });
      mediaRecorder.ondataavailable = (e) => {
        if (e.data && e.data.size > 0) recordedChunks.push(e.data);
      };
      mediaRecorder.onstop = () => {
        const blob = new Blob(recordedChunks, { type: mimeType });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.download = `video-${Date.now()}.webm`;
        a.href = url;
        a.click();
        setTimeout(() => URL.revokeObjectURL(url), 2000);
      };

      mediaRecorder.start();
      videoBtn.classList.add('recording');
    });

    startCamera();
    animate();
  </script>
</body>
</html>
